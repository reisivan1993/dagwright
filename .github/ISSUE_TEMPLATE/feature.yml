name: Feature request
description: Propose a scoped compiler or verification improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem independently of a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Include contract, compatibility, determinism, and engine-neutrality implications.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: I checked PLAN.md and the proposal belongs to the active milestone.
          required: true
        - label: I will open an RFC if this changes public contracts or architecture.
          required: true
